services:
  auth:
    build:
      context: ./backend/auth
      dockerfile: Dockerfile
    container_name: resume_auth
    environment:
      DB_HOST: auth-postgres
      DB_PORT: 5432
    env_file:
      - ./backend/auth/.env
    ports:
      - "8001:8000"
    volumes:
      - ./backend/auth:/service
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - auth-network
    restart: on-failure

  resume:
    build:
      context: ./backend/resume
      dockerfile: Dockerfile
    container_name: resume
    environment:
      DB_HOST: resume-postgres
      DB_PORT: 5432
      MINIO_ENDPOINT_URL: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./backend/resume/.env
    ports:
      - "8002:8000"
    volumes:
      - ./backend/resume:/service
    depends_on:
      resume-postgres:
        condition: service_healthy
    networks:
      - resume-network
    restart: on-failure

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    env_file:
      - ./backend/resume/.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - resume-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/ready" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  resume-postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: resume_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_resume:/var/lib/postgresql/data
    networks:
      - resume-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d resume_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: resume_auth_pg
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    networks:
      - auth-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resume_redis
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "16379:6379"
    volumes:
      - redisdata_resume:/data
    networks:
      - resume-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: on-failure

volumes:
  pgdata_auth:
  pgdata_resume:
  minio_data:
  redisdata_resume:

networks:
  auth-network:
    driver: bridge
  resume-network:
    driver: bridge
